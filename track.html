<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track My Order | Pizza World & Fast Food</title>
<meta name="description" content="Track your Pizza World order live.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
<link rel="preload" href="fonts/lobster-two-700i.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/style.css">
<style>
.twrap{max-width:560px;margin:0 auto;padding:26px 16px 70px}
.twrap h1{color:#fff;font-size:34px;margin:10px 0 4px}
.twrap h1 em{color:#ffb703;font-family:'Lobster Two',cursive}
.twrap .sub{color:#aaa;font-size:14px;margin-bottom:20px}
.tsearch{display:flex;gap:8px;margin-bottom:26px}
.tsearch input{flex:1;padding:13px 16px;border-radius:12px;border:1px solid #555;background:#1c1414;color:#fff;font-size:16px;text-transform:uppercase}
.tsearch button{background:#d62828;color:#fff;border:none;border-radius:12px;padding:13px 22px;font-weight:800;font-size:15px;cursor:pointer}
.tcard{background:#fff;border-radius:18px;overflow:hidden;color:#222;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tcard .th{padding:18px 22px;background:#161010;color:#fff;display:flex;justify-content:space-between;align-items:center}
.tcard .th b{color:#ffb703;font-size:21px}
.tcard .tb{padding:22px}
.tsteps{list-style:none;margin:0 0 18px;padding:0}
.tsteps li{display:flex;gap:14px;align-items:flex-start;padding:11px 0;position:relative;color:#999}
.tsteps li::before{content:"";width:34px;height:34px;border-radius:50%;background:#eee;flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:17px}
.tsteps li.done{color:#222;font-weight:700}
.tsteps li.done::before{background:#4caf50;content:"✓";color:#fff;font-weight:800}
.tsteps li.now{color:#111;font-weight:800}
.tsteps li.now::before{background:#ffb703;content:"●";color:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
.tsteps li:not(:last-child)::after{content:"";position:absolute;left:16px;top:48px;bottom:-6px;width:2px;background:#e0e0e0}
.tsteps li.done:not(:last-child)::after{background:#4caf50}
.tsteps small{display:block;font-weight:400;color:#888;font-size:12px}
.temo{font-size:20px;width:30px;text-align:center;flex:0 0 30px;margin-top:2px}
.titems{background:#f7f3ec;border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:6px}
.titems div{display:flex;justify-content:space-between;padding:5px 0}
.ttotal{display:flex;justify-content:space-between;font-weight:800;font-size:19px;padding:10px 4px;color:#d62828}
.terr{background:#3a1414;border:1px solid #d62828;color:#ffb3b3;border-radius:12px;padding:16px;text-align:center}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4caf50;margin-right:7px;animation:blink 1.4s infinite}
</style></head>
<body data-page="track" style="background:#0e0b09">
<header class="nav"><a class="logo" href="index.html"><img src="images/ui-logo.jpg" alt="Pizza World & Fast Food" width="180" height="58"></a>
<nav><a href="index.html">Home</a><a href="menu.html">Our Menu</a><a href="deals.html">Special Deals</a><a href="contact.html">Contact</a></nav>
<div class="nav-r"><a class="cartbtn" href="checkout.html">Cart <span id="cartCount">0</span></a></div></header>
<div class="twrap">
  <h1>Track <em>My Order</em></h1>
  <p class="sub"><span class="live-dot"></span>Live updates — no need to refresh.</p>
  <div class="tsearch">
    <input id="tid" placeholder="e.g. PW-1001" maxlength="12">
    <button id="tbtn">Track</button>
  </div>
  <div id="tout"></div>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/data.js"></script>
<script src="js/photos.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const STEPS=[["new","📥","Order received"],["accepted","✅","Order accepted"],["preparing","👨‍🍳","Preparing your food"],["ready","📦","Ready for rider"],["dispatched","🛵","Rider on the way"],["delivered","🏠","Delivered — enjoy!"]];
  let unsub=null;
  function track(id){
    id=(id||"").trim().toUpperCase();
    if(!id) return;
    if(unsub) unsub();
    if(!DB.configured()){ $("#tout").innerHTML=`<div class="terr">⚠️ Live tracking is not set up yet. Please ask the restaurant for your order status on WhatsApp.</div>`; return; }
    $("#tout").innerHTML=`<div class="terr">🔎 Looking for <b>${id}</b>…</div>`;
    unsub=DB.listenOrder(id,o=>{
      if(!o){ $("#tout").innerHTML=`<div class="terr">❌ No order found with ID <b>${id}</b>. Check the number and try again.</div>`; return; }
      render(o);
    });
  }
  function render(o){
    if(o.status==="cancelled"){
      $("#tout").innerHTML=`<div class="tcard"><div class="th"><b>${o.id}</b><span>❌ Cancelled</span></div>
      <div class="tb"><p style="color:#666">This order was cancelled. Please contact the restaurant on WhatsApp if you have questions.</p></div></div>`; return;
    }
    const cur=STEPS.findIndex(s=>s[0]===o.status);
    const steps=STEPS.map(([k,e,l],i)=>{
      const cls=i<cur?"done":i===cur?"now":"";
      const t=o.history&&o.history[k]?new Date(o.history[k]).toLocaleTimeString("en-PK",{hour:"2-digit",minute:"2-digit"}):"";
      return `<li class="${cls}"><span class="temo">${e}</span><span>${l}${t?`<small>${t}</small>`:""}</span></li>`;
    }).join("");
    const items=(o.items||[]).map(i=>`<div><span>${i.qty} × ${i.name}${i.label&&i.label!=="Add"?" ("+i.label+")":""}</span><b>Rs. ${i.price*i.qty}</b></div>`).join("");
    $("#tout").innerHTML=`<div class="tcard"><div class="th"><b>${o.id}</b><span style="font-size:14px;color:#ffb703">${STATUS_LABEL[o.status]||o.status}</span></div>
      <div class="tb"><ul class="tsteps">${steps}</ul>
      <div class="titems">${items}</div>
      <div class="ttotal"><span>Total</span><span>Rs. ${o.total}</span></div></div></div>`;
  }
  $("#tbtn").onclick=()=>track($("#tid").value);
  $("#tid").onkeydown=e=>{ if(e.key==="Enter") track($("#tid").value); };
  const q=new URLSearchParams(location.search).get("id");
  if(q){ $("#tid").value=q; track(q); }
})();
</script>
</body></html>
