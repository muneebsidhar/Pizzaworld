<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Dashboard | Pizza World</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
<link rel="preload" href="fonts/lobster-two-700i.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/style.css">
<style>
.kwrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.khead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 18px}
.khead h1{font-size:34px;color:#fff}
.khead h1 em{color:#ffb703;font-family:'Lobster Two',cursive}
.ktabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.ktab{border:1px solid #444;background:#1c1414;color:#ffb703;border-radius:999px;padding:9px 20px;font-weight:700;cursor:pointer;font-size:14px}
.ktab.on{background:#d62828;border-color:#d62828;color:#fff}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.kcard{background:#fff;border-radius:16px;overflow:hidden;color:#222;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.kcard.flash{animation:kflash 1.2s ease 3}
@keyframes kflash{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 6px #ffb703,0 8px 30px rgba(255,183,3,.6)}}
.kcard .kth{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#161010;color:#fff}
.kcard .kth b{font-size:19px;color:#ffb703}
.kcard .kth small{color:#aaa}
.kstatus{display:inline-block;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;background:#eee;color:#333}
.kstatus.new{background:#d62828;color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.kstatus.accepted{background:#2196f3;color:#fff}
.kstatus.preparing{background:#ff9800;color:#fff}
.kstatus.ready{background:#9c27b0;color:#fff}
.kstatus.dispatched{background:#009688;color:#fff}
.kstatus.delivered{background:#4caf50;color:#fff}
.kstatus.cancelled{background:#777;color:#fff}
.kcard .kb{padding:16px 18px}
.kcard ul{list-style:none;margin:0 0 12px;padding:0;font-size:14px}
.kcard li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #ddd}
.kcard .cust{background:#f7f3ec;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.kcard .cust b{color:#111}
.kbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kbtns button{border:none;border-radius:10px;padding:11px 8px;font-weight:800;font-size:13px;cursor:pointer;color:#fff}
.b-accepted{background:#2196f3}.b-preparing{background:#ff9800}.b-ready{background:#9c27b0}
.b-dispatched{background:#009688}.b-delivered{background:#4caf50}.b-cancelled{background:#999}
.kbtns button:disabled{opacity:.35;cursor:default}
.kempty{text-align:center;color:#888;padding:60px 20px;font-size:17px}
#gate{max-width:380px;margin:80px auto;background:#1c1414;border:1px solid #444;border-radius:18px;padding:34px 28px;text-align:center}
#gate h2{color:#ffb703;margin-bottom:8px;font-family:'Lobster Two',cursive;font-size:32px}
#gate p{color:#aaa;font-size:14px;margin-bottom:18px}
#gate input{width:100%;padding:13px 16px;border-radius:10px;border:1px solid #555;background:#0e0b09;color:#fff;font-size:16px;margin-bottom:12px;box-sizing:border-box}
#gate button{background:#d62828;color:#fff;border:none;border-radius:10px;padding:13px;width:100%;font-weight:800;font-size:16px;cursor:pointer}
#gate .gerr{color:#ff8080;font-size:13px;min-height:20px;margin-top:8px}
.kfoot{text-align:center;color:#666;font-size:13px;margin-top:30px}
</style></head>
<body data-page="kitchen" style="background:#0e0b09">
<div class="kwrap">
  <div id="gate">
    <h2>Kitchen Login</h2>
    <p>Staff only. Enter the kitchen password.</p>
    <input type="password" id="gpass" placeholder="Password" autocomplete="off">
    <button id="gbtn">Open Dashboard</button>
    <div class="gerr" id="gerr"></div>
  </div>
  <div id="dash" hidden>
    <div class="khead">
      <h1>🍕 Kitchen <em>Dashboard</em></h1>
      <div style="display:flex;gap:10px;align-items:center">
        <span id="kstatus" style="color:#ffb703;font-size:13px">⏳ Connecting…</span>
        <span id="kcount" style="color:#aaa;font-size:14px"></span>
        <button id="reBtn" class="ktab" title="Reload orders from database">↻ Reload</button>
        <button id="soundBtn" class="ktab on">🔔 Sound on</button>
      </div>
    </div>
    <div class="ktabs">
      <button class="ktab on" data-f="active">🔥 Active</button>
      <button class="ktab" data-f="all">📋 All orders</button>
      <button class="ktab" data-f="done">✅ Completed</button>
    </div>
    <div class="kgrid" id="kgrid"></div>
    <div class="kempty" id="kempty" hidden>No orders here yet. New orders will pop up automatically. 🔔</div>
    <p class="kfoot">Pizza World & Fast Food — kitchen dashboard. Keep this tab open for live orders.</p>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  let filter="active", soundOn=true, knownIds=new Set(), firstLoad=true;
  const audio=new Audio("data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hQg9+k+f4/URCEEWPVu3nl4zBIVlqv6/LhWg0TXbTp5K9YCA4tfPr+EGjJBNHvAz8mTKgY/ltnH9sBdEAw7f+f4+CN1Z0qL2e2m2/8tmiXbU3QiOc5Q==");
  function beep(){ if(!soundOn) return; try{ audio.currentTime=0; audio.play().catch(()=>{}); }catch(e){} }

  // gate
  $("#gbtn").onclick=tryLogin; $("#gpass").onkeydown=e=>{ if(e.key==="Enter") tryLogin(); };
  function tryLogin(){
    if($("#gpass").value===KITCHEN_PASSWORD){
      $("#gate").hidden=true; $("#dash").hidden=false; start();
    } else { $("#gerr").textContent="Wrong password. Try again."; }
  }

  document.querySelectorAll(".ktab[data-f]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".ktab[data-f]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); filter=b.dataset.f; render(lastOrders);
  });
  $("#soundBtn").onclick=()=>{ soundOn=!soundOn; $("#soundBtn").textContent=soundOn?"🔔 Sound on":"🔕 Sound off"; $("#soundBtn").classList.toggle("on",soundOn); };

  let lastOrders=[], stopListen=null;
  function setStatus(t){ const el=$("#kstatus"); if(el) el.textContent=t; }
  function start(){
    setStatus("⏳ Connecting… (db.js v"+(DB.version||"?")+")");
    if(!DB.configured()){ $("#kgrid").innerHTML=""; $("#kempty").hidden=false;
      $("#kempty").textContent="⚠️ Firebase not configured yet. Follow FIREBASE-SETUP.md, then reload."; setStatus("🔴 Not configured"); return; }
    if(stopListen) stopListen();
    let gotData=false;
    setTimeout(()=>{ if(!gotData) setStatus("⚠️ Still connecting… check internet, then press ↻ Reload"); },8000);
    stopListen=DB.listenOrders(orders=>{
      gotData=true;
      setStatus("🟢 Live — "+orders.length+" orders (db.js v"+(DB.version||"?")+")");
      orders.forEach(o=>{ if(!knownIds.has(o.id)){ knownIds.add(o.id); if(!firstLoad){ beep(); flashCard(o.id); } } });
      firstLoad=false; lastOrders=orders; render(orders);
    });
  }
  $("#reBtn").onclick=()=>{ firstLoad=true; knownIds=new Set(); start(); };
  function flashCard(id){ requestAnimationFrame(()=>{ const el=document.querySelector(`[data-oid="${id}"]`); if(el) el.classList.add("flash"); }); }

  const ACTIVE=["new","accepted","preparing","ready","dispatched"];
  function render(orders){
    const list=orders.filter(o=>filter==="all"?true:filter==="done"?!ACTIVE.includes(o.status):ACTIVE.includes(o.status));
    $("#kcount").textContent=orders.filter(o=>ACTIVE.includes(o.status)).length+" active";
    $("#kempty").hidden=list.length>0;
    $("#kgrid").innerHTML=list.map(o=>{
      const items=(o.items||[]).map(i=>`<li><span>${i.qty} × ${i.name}${i.label&&i.label!=="Add"?" ("+i.label+")":""}</span><b>Rs. ${i.price*i.qty}</b></li>`).join("");
      const btns=[["accepted","b-accepted","✅ Accept"],["preparing","b-preparing","👨‍🍳 Preparing"],["ready","b-ready","📦 Ready"],["dispatched","b-dispatched","🛵 Dispatched"],["delivered","b-delivered","🏠 Delivered"],["cancelled","b-cancelled","❌ Cancel"]];
      const cur=ORDER_STATUSES.indexOf(o.status);
      const btnHtml=btns.map(([s,c,l])=>{
        const dis=(s==="cancelled")?(o.status==="cancelled"||o.status==="delivered"):ORDER_STATUSES.indexOf(s)<=cur;
        return `<button class="${c}" data-st="${s}" data-id="${o.id}" ${dis?"disabled":""}>${l}</button>`;
      }).join("");
      const time=new Date(o.createdAt).toLocaleTimeString("en-PK",{hour:"2-digit",minute:"2-digit"});
      return `<article class="kcard" data-oid="${o.id}">
        <div class="kth"><b>${o.id}</b><small>${time}</small></div>
        <div class="kb"><div style="margin-bottom:10px"><span class="kstatus ${o.status}">${STATUS_LABEL[o.status]||o.status}</span>
        <span style="float:right;font-weight:800;font-size:18px">Rs. ${o.total}</span></div>
        <ul>${items}</ul>
        <div class="cust">👤 <b>${o.name}</b> · 📞 <a href="tel:${o.phone}">${o.phone}</a><br>📍 ${o.address}${o.note?`<br>📝 <i>${o.note}</i>`:""}</div>
        <div class="kbtns">${btnHtml}</div></div></article>`;
    }).join("");
    document.querySelectorAll(".kbtns button:not([disabled])").forEach(b=>b.onclick=async()=>{
      b.disabled=true; await DB.setStatus(b.dataset.id,b.dataset.st);
    });
  }
})();
</script>
</body></html>
